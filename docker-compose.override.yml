services:
  app:
    container_name: tanstack-start-template
    command: npm run dev -- --host --port 5173
    stdin_open: true
    tty: true
    # Config da API (API_BASE_URL p/ o SSR e VITE_API_DOMAIN p/ o navegador) vem
    # do app/.env — não fixamos valores aqui. required:false não quebra o `up`
    # quando o arquivo não existe (ex.: clone novo). Veja app/.env.sample.
    env_file:
      - path: ./app/.env
        required: true
    environment:
      # Ativa polling do watcher (chokidar) p/ hot reload em bind mount (macOS)
      - CHOKIDAR_USEPOLLING=true
    ports:
      - 5173:5173
    volumes:
      # Código (pasta app/) montado do host → hot reload
      - ./app:/app
      # Volume anônimo preserva o node_modules instalado na imagem
      - /app/node_modules
    # Permite que o SSR dentro do container alcance um backend no host
    # (inclusive no Linux, onde host.docker.internal não existe por padrão).
    extra_hosts:
      - "host.docker.internal:host-gateway"
